name: Backend keep-alive
# Supabase pauses free projects after 7 days without database activity.
# This runs a harmless read-only lookup twice a day so the project stays awake,
# and fails loudly (GitHub emails the owner) if the backend is down.
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          API: https://bblutagmgsyybofkfzuf.supabase.co
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJibHV0YWdtZ3N5eWJvZmtmenVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTc2MzAsImV4cCI6MjEwMjg5MzYzMH0.AZDrdTS6daflMWCknbZYQpX-C7tLk2BgnQXRtbEk4pc   # public anon key, same one shipped in scan.html
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API/rest/v1/rpc/resolve_tag" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json" \
            -d '{"p_token":"00000000000000000000000000000000"}')
          echo "status $code"
          test "$code" = "200"
